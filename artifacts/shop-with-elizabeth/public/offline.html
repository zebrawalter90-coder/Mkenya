<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#df4a30" />
    <title>You're offline · Mkenya Shop</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f8f4e9; color: #193238; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background-image: radial-gradient(#19323810 1px, transparent 1px); background-size: 14px 14px; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #dfd5c5; border-radius: 24px; background: #fffdf8; box-shadow: 0 20px 56px #19323818; }
      .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 16px; background: #df4a30; color: white; font-size: 24px; font-weight: 800; }
      h1 { margin: 24px 0 8px; font-size: clamp(1.8rem, 8vw, 2.6rem); letter-spacing: -.05em; }
      p { color: #607176; line-height: 1.65; }
      a { display: inline-flex; margin-top: 16px; padding: 12px 18px; border-radius: 999px; background: #286553; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>You're offline.</h1>
      <p>Your saved Mkenya Shop pages may still be available. Reconnect to browse the latest local finds and contact sellers.</p>
      <a href="./">Try the shop again</a>
    </main>
  </body>
</html>
