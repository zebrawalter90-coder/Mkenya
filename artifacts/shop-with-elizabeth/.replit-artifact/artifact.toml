kind = "web"
previewPath = "/"
title = "ShopWithElizabeth"
version = "1.0.0"
id = "artifacts/shop-with-elizabeth"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21915

[services.development]
run = "pnpm --filter @workspace/shop-with-elizabeth run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shop-with-elizabeth", "run", "build" ]
publicDir = "artifacts/shop-with-elizabeth/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21915"
BASE_PATH = "/"
